[project]
name = "datum"
version = "0.0.0"
description = "Open single-camera scouting infrastructure for football."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Datum contributors" }]
keywords = ["football", "soccer", "computer-vision", "scouting", "player2vec", "embeddings"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Runtime deps stay minimal. Anything heavier goes behind an extra so users on
# constrained hardware aren't forced to pull faiss/qdrant just to run ingest.
dependencies = [
    "numpy>=1.26,<2.0",
    "opencv-python-headless>=4.9,<5.0",
    "av>=12.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
]

[project.optional-dependencies]
api    = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
index  = ["faiss-cpu>=1.8"]
qdrant = ["qdrant-client>=1.9"]
milvus = ["pymilvus>=2.4"]
store  = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1", "alembic>=1.13"]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "types-pyyaml",
]

[project.scripts]
datum = "datum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datum"]

# PyTorch publishes platform-specific wheels (CPU, cu124, cu126, cu128...) on
# its own index, not PyPI. Without this, `uv sync` silently installs the CPU
# wheel and torch.cuda.is_available() returns False. The `explicit = true`
# flag means this index is only consulted for packages that ask for it via
# [tool.uv.sources] below, so the rest of resolution is unaffected.
#
# Change the URL if your NVIDIA driver targets a different CUDA major.
# Driver 550 to 555  -> cu124
# Driver 560 to 565  -> cu126
# Driver 570+        -> cu128
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch       = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF", "SIM", "PL", "PERF"]
ignore = [
    "PLR0913",  # too many args. Argued case-by-case, not globally.
    "PLR2004",  # magic numbers in tests are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
"notebooks/**" = ["E402", "F401", "F841"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src/datum"]
# CV libs do not ship clean stubs; this project does not fight them in third-party code.
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests that hit GPU or download fixtures",
    "integration: marks tests that span multiple pipeline stages",
    "golden: marks tests that diff against frozen artifacts",
]
